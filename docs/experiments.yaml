# The experiment registry. Meaning lives here; NUMBERS DO NOT.
#
# Every AUC in docs/EXPERIMENTS.md is read off disk by tools/exp_log.py at render
# time. Do not write results into this file -- a transcribed number goes stale the
# next time a run improves, and it goes stale invisibly, because the document
# around it still looks authoritative.
#
# What belongs here is what a directory listing cannot tell you: why a run was
# launched, which architecture it belongs to, what it settled, and what is queued
# but not yet started.
#
# WHEN YOU START AN EXPERIMENT, ADD IT HERE FIRST, with status: queued. Then
# `python tools/exp_log.py --check` exits non-zero on any run directory the ledger
# has never heard of, which is the one failure this file exists to prevent.
#
# Fields:
#   id        short handle used in conversation
#   group     which section it renders under
#   arch      ARC-CT (published) | context (indication + age + sex)
#   cohort    what it trained on;  classes: the label schema
#   masks     anatomy-mask coverage during TRAINING
#   runs      run directory names under $RAC_WORK/runs
#   evals     "<cohort>/<cell>" under $RAC_WORK/eval_matrix
#   patience, val_every
#             early-stopping config. Their product is the earliest update at which
#             stopping could fire; a quiet run below it was killed, not converged,
#             and is excluded from the mean instead of dragging it down.
#   status    queued | planned  (otherwise derived from disk)
#   finding   what the experiment settled, in prose

architectures:
  ARC-CT: >-
    The published model (MICCAI 2026 TIA). R3D-18 pretrained on Kinetics, layer4
    feature map [B,512,12,12,12], AnatomyQFormer with 39 queries (10 anatomy, 27
    pathology, 2 global), CLIP-contrastive against a frozen CXR-BERT with LoRA on
    layers 8-11. The image is the only input. Every number under this heading is a
    baseline, never a result of the new work.
  context: >-
    The new model. The same tower, and queries[:39] load bit-identical from the
    ARC-CT checkpoint, plus ONE new parameter row (clinical global) read out over
    67 slots: 27 of them are the pathology queries re-read after conditioning on
    the indication (C1: cross-attention then FiLM), and pooling is steered by a
    relevance weight that can only ever raise, never suppress (C2: w = 1 + beta*r).
    Age band and sex enter as context tokens. At initialisation it is numerically
    the published model, so every delta reads as departure from ARC-CT.

groups:
  - id: arcct_peds
    title: "ARC-CT: pediatric fine-tuning (V-series)"
    note: >-
      Recipe search on the 8,816-volume BCH cohort, warm-started from the published
      adult checkpoint and re-headed to the 27-class pediatric schema. V1 is the
      recipe everything since is measured against; V5 is the best of the search.
      The three V1 seeds are also where the seed band comes from.
  - id: arcct_combined
    title: "ARC-CT: joint pediatric + CT-RATE (C-series)"
    note: >-
      The same architecture trained on both cohorts together, testing whether adult
      volume helps the pediatric half and what the label harmonisation costs.
      "mix" = each cohort keeps its own labeller; "harm" = one labeller for both.
  - id: phase0
    title: "Phase 0: does anatomy routing cost accuracy, and is that pediatric?"
    note: >-
      Not training runs -- the same checkpoints evaluated twice, once pooling
      globally and once through the anatomy masks. The question is whether the
      routing penalty in the pediatric cohort is a property of children or of the
      method. A cell whose routed column reads "no mask" had no mask supplied and
      fell back to global; it is not a routed measurement.
  - id: ctx1
    title: "Context ladder, first pass (ctx)"
    note: >-
      Eight rungs x three seeds on pediatrics alone, adding one mechanism at a
      time. This pass is superseded: beta was initialised at -6, where
      d(beta)/db = sigma(-6) = 0.0025, so the relevance gate could not open within
      the run -- measured +0.00012 against a predicted +0.000100. The C2 rung here
      is therefore not a test of C2. Kept because the C1 rungs are unaffected.
  - id: ctx2
    title: "Context ladder, second pass (ctx2)"
    note: >-
      The rerun with beta_init -2, a 20x learning-rate multiplier on the zero-init
      context modules, and patience 8. This is the pass that picks the winner for
      the joint runs.
  - id: joint
    title: "Joint context runs (the headline)"
    note: >-
      The winning rung retrained on the combined 49,545-volume split, alongside
      ct_only on the SAME split. The joint baseline is not redundant: CT-RATE
      outnumbers pediatrics six to one there, and a configuration that wins on
      7,001 pediatric volumes is not thereby a winner in that regime.
  - id: ctrate_only
    title: "CT-RATE only: the adult gate"
    note: >-
      The run that has to clear 0.8574 on the 18 classes CT-RATE publishes. No
      pediatric data, published 18-class labels, warm-started from the published
      adult checkpoint (qformer.queries (30,768), so the context bank appends one
      row to reach 31). ct_only runs beside it on the same data, because 0.8574
      came from THEIR training run and without our own control a result of 0.855
      could not be told apart from a recipe that fails to reproduce ARC-CT.
  - id: labels_v3
    title: "Label repair (V3) and the gold standard"
    note: >-
      A 200-report gold standard, annotated five times independently, against
      which the pediatric label definitions were repaired. Qwen against the gold
      agrees on 95.7% of 5,400 cells at mean kappa 0.855. The gains are
      concentrated on the classes two text-only audits had already proved broken.
  - id: ctx3
    title: "Masked ablation (ctx3)"
    note: >-
      The winner rerun with anatomy masks on the adult half too. Held separate from
      the ctx2 ladder on purpose: switching masks on at the same time as C1/C2
      would make the gain unattributable.

experiments:
  # ------------------------------------------------------- ARC-CT pediatric
  - id: V1
    group: arcct_peds
    arch: ARC-CT
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [peds_finetune, peds_finetune_v1_seed1, peds_finetune_v1_seed2]
    evals: [peds/V1, ctrate/V1, ctrate/V1_masked, combined/V1]
    patience: 5
    val_every: 400
    finding: >-
      The reference recipe, and the source of the seed band: three seeds of an
      identical configuration give sd = 0.0046, so a ladder delta below about
      0.0092 is inside seed noise and is not a difference. Every ablation in this
      project is read against that number.
  - id: V2
    group: arcct_peds
    arch: ARC-CT
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [peds_finetune_v2]
    evals: [peds/V2, ctrate/V2, combined/V2]
    patience: 5
    val_every: 400
  - id: V3
    group: arcct_peds
    arch: ARC-CT
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [peds_finetune_v3]
    evals: [peds/V3, ctrate/V3, combined/V3]
    patience: 5
    val_every: 400
  - id: V4
    group: arcct_peds
    arch: ARC-CT
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [peds_finetune_v4]
    evals: [peds/V4, ctrate/V4, combined/V4]
    patience: 5
    val_every: 400
  - id: V5
    group: arcct_peds
    arch: ARC-CT
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [peds_finetune_v5]
    evals: [peds/V5, ctrate/V5, ctrate/V5_masked, combined/V5]
    patience: 5
    val_every: 400
    finding: >-
      Best pediatric held-out AUC of the recipe search, and the checkpoint the
      age-stratified analysis runs on. Its lead over V1 on pediatrics is inside
      the 0.0046 seed band, so it is the better recipe by selection, not by a
      demonstrated margin.

  # ------------------------------------------------------- ARC-CT combined
  - id: C16
    group: arcct_combined
    arch: ARC-CT
    cohort: peds + CT-RATE 16k
    classes: 27
    masks: peds only
    runs: [combined_16k]
    evals: [peds/C16, ctrate/C16, combined/C16]
    patience: 5
    val_every: 400
  - id: C47mix
    group: arcct_combined
    arch: ARC-CT
    cohort: peds + CT-RATE 47k
    classes: 27
    masks: peds only
    runs: [combined_47k]
    evals: [peds/C47mix, ctrate/C47mix, ctrate/C47mix_masked, combined/C47mix_mixlbl, combined/C47mix_harmlbl]
    patience: 5
    val_every: 400
    finding: >-
      The strongest held-out numbers in the project, and the reason the joint split
      is where the new model has to be shown: adult volume lifts the pediatric half
      too. Each cohort keeps its own labeller here, which is also its weakness --
      see C47harm.
  - id: C47harm
    group: arcct_combined
    arch: ARC-CT
    cohort: peds + CT-RATE 47k
    classes: 27
    masks: peds only
    runs: [combined_47k_harmonised]
    evals: [peds/C47harm, ctrate/C47harm, ctrate/C47harm_masked, combined/C47harm_harmlbl, combined/C47harm_mixlbl]
    patience: 5
    val_every: 400
    finding: >-
      One labeller across both cohorts. It scores below C47mix, and that gap is
      partly the price of removing an artefact rather than a loss of signal: with
      two labellers the same class carried two thresholds across the halves --
      Lymphadenopathy 25.9% adult against 7.9% pediatric, of which 10.8 points were
      the annotator and not the disease. The harmonised labels are what the context
      runs train on; the PUBLISHED CT-RATE labels stay the adult evaluation target.

  # ------------------------------------------------------------- phase 0
  - id: P0_routing
    group: phase0
    arch: ARC-CT
    cohort: eval only
    classes: 27
    masks: eval-time
    runs: []
    evals: [ctrate/V1_masked, ctrate/V5_masked, ctrate/C47mix_masked, ctrate/C47harm_masked, peds/V1, peds/V5, combined/V1, combined/V5]
    status: planned
    finding: >-
      The routing penalty is real and it is NOT pediatric -- on the same
      checkpoint and the same 27 classes, CT-RATE falls 0.7991 to 0.7617 (-0.0375)
      and pediatrics 0.8005 to 0.7651 (-0.0354). But the macro number badly
      misdescribes what happens, and the per-class breakdown is the finding.
      TWO classes account for roughly two thirds of the entire penalty:
      Pneumothorax 0.695 to 0.317 and Bone lesion 0.616 to 0.347. Those are BELOW
      CHANCE. A model merely looking in the wrong place lands near 0.5; below 0.5
      is systematic inversion, and it reproduces in every cohort and every
      checkpoint measured. Both route to the two regions we DERIVED rather than
      segmented with TotalSegmentator -- the pleural shell and bone. Drop those two
      and the penalty falls to -0.0146 on CT-RATE and -0.0159 on pediatrics, with
      7 of the remaining 24 classes IMPROVING under routing (Pulmonary metastases
      +0.061, Pleural thickening +0.018). Three classes are never routed at all
      and are identical by construction.
      A structural contributor to the residual: _routed_probs scores organ_lat
      against the class prompts, but training aligns organ_lat to REGION SENTENCES
      (L_org) and the class prompts to the GLOBAL latent (L_cls). That pairing is
      never trained, so part of the remaining -0.015 is a read-out mismatch rather
      than a statement about anatomy.
      Two loose ends. ctrate/V1 reads 0.7954 against ctrate/V1_masked's 0.7991 on
      the same checkpoint, labels and order -- config drift between two evaluation
      runs, unexplained; it does not touch the paired -0.0375. And the combined
      cells lose more than either cohort alone (-0.0353, and -0.0475 when
      restricted to masked rows). The obvious explanation -- that partial mask
      coverage mixes two score scales in one ranking -- was tested and is wrong,
      since restricting to masked rows makes it worse, not better. Unexplained.

  # ---------------------------------------------------------- context ctx
  - id: ctx/ct_only
    group: ctx1
    arch: context
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [ctx_ct_only_seed0, ctx_ct_only_seed1, ctx_ct_only_seed2]
    patience: 5
    val_every: 400
  - id: ctx/concat
    group: ctx1
    arch: context
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [ctx_concat_seed0, ctx_concat_seed1, ctx_concat_seed2]
    patience: 5
    val_every: 400
  - id: ctx/c1_xattn
    group: ctx1
    arch: context
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [ctx_c1_xattn_seed0, ctx_c1_xattn_seed1, ctx_c1_xattn_seed2]
    patience: 5
    val_every: 400
  - id: ctx/c1_full
    group: ctx1
    arch: context
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [ctx_c1_full_seed0, ctx_c1_full_seed1, ctx_c1_full_seed2]
    patience: 5
    val_every: 400
  - id: ctx/c2
    group: ctx1
    arch: context
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [ctx_c2_seed0, ctx_c2_seed1, ctx_c2_seed2]
    patience: 5
    val_every: 400
    finding: >-
      Not a test of C2. beta was initialised at -6, where the softplus gradient is
      sigma(-6) = 0.0025; over the whole run beta moved by a measured 0.00012
      against a predicted 0.000100, so the relevance gate never opened and this
      rung is C1 with an inert head attached. The rerun is ctx2/c2.
  - id: ctx/fusion_gated
    group: ctx1
    arch: context
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [ctx_fusion_gated_seed0, ctx_fusion_gated_seed1, ctx_fusion_gated_seed2]
    patience: 5
    val_every: 400
  - id: ctx/isolation_off
    group: ctx1
    arch: context
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [ctx_isolation_off_seed0, ctx_isolation_off_seed1, ctx_isolation_off_seed2]
    patience: 5
    val_every: 400
    finding: >-
      Killed before producing anything. With C2 off, ctx_out.r is None and the
      guard indexed it anyway -- a TypeError that took out nine of this ladder's
      twenty-four tasks. The guard now holds all classes stable when r is None.
  - id: ctx/age_scalar
    group: ctx1
    arch: context
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [ctx_age_scalar_seed0]
    patience: 5
    val_every: 400
    finding: Same TypeError as isolation_off; never produced a checkpoint.

  # --------------------------------------------------------- context ctx2
  - id: ctx2/ct_only
    group: ctx2
    arch: context
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [ctx2_ct_only_seed0, ctx2_ct_only_seed1, ctx2_ct_only_seed2]
    patience: 8
    val_every: 400
    finding: >-
      The architecture-only control: the context model with the Q-Former's context
      path switched off, so it is the published model under the new code path. Every
      other rung is a delta against this, not against V1.
  - id: ctx2/concat
    group: ctx2
    arch: context
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [ctx2_concat_seed0, ctx2_concat_seed1, ctx2_concat_seed2]
    patience: 8
    val_every: 400
  - id: ctx2/c1_xattn
    group: ctx2
    arch: context
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [ctx2_c1_xattn_seed0, ctx2_c1_xattn_seed1, ctx2_c1_xattn_seed2]
    patience: 8
    val_every: 400
  - id: ctx2/c1_full
    group: ctx2
    arch: context
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [ctx2_c1_full_seed0, ctx2_c1_full_seed1, ctx2_c1_full_seed2]
    patience: 8
    val_every: 400
  - id: ctx2/c2
    group: ctx2
    arch: context
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [ctx2_c2_seed0, ctx2_c2_seed1, ctx2_c2_seed2]
    patience: 8
    val_every: 400
    status: queued
  - id: ctx2/fusion_gated
    group: ctx2
    arch: context
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [ctx2_fusion_gated_seed0, ctx2_fusion_gated_seed1, ctx2_fusion_gated_seed2]
    patience: 8
    val_every: 400
    status: queued
  - id: ctx2/isolation_off
    group: ctx2
    arch: context
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [ctx2_isolation_off_seed0, ctx2_isolation_off_seed1, ctx2_isolation_off_seed2]
    patience: 8
    val_every: 400
    status: queued
  - id: ctx2/age_scalar
    group: ctx2
    arch: context
    cohort: peds 7,001
    classes: 27
    masks: peds 100%
    runs: [ctx2_age_scalar_seed0, ctx2_age_scalar_seed1, ctx2_age_scalar_seed2]
    patience: 8
    val_every: 400
    status: queued

  # --------------------------------------------------------------- joint
  - id: joint/ct_only
    group: joint
    arch: context
    cohort: peds + CT-RATE 49,545
    classes: 27
    masks: peds only (71.6% once ctx3 masks land)
    runs: [joint_ct_only_seed0, joint_ct_only_seed1, joint_ct_only_seed2]
    patience: 8
    val_every: 800
    status: queued
  - id: joint/winner
    group: joint
    arch: context
    cohort: peds + CT-RATE 49,545
    classes: 27
    masks: peds only
    runs: []
    patience: 8
    val_every: 800
    status: planned
    finding: >-
      Waits on the ctx2 ladder to name a winner. Submitted as
      `sbatch --export=ALL,JOINT_RUNG=<winner> --array=0-5%3
      pipeline/05_train/34_train_joint_ctx.sbatch`, which runs it and the joint
      baseline in one array.

  # --------------------------------------------------------- ct-rate only
  - id: ctrate/ct_only
    group: ctrate_only
    arch: ARC-CT
    cohort: CT-RATE 42,544
    classes: 18 (published)
    masks: CT-RATE, gated at 99%
    runs: [ctrate_ct_only_seed0, ctrate_ct_only_seed1, ctrate_ct_only_seed2]
    patience: 4
    val_every: 1200
    status: queued
    finding: >-
      The control, and it is not a formality: it must come back near the published
      checkpoint's own 0.8547 for the context arm's delta to mean anything.
  - id: ctrate/c2
    group: ctrate_only
    arch: context
    cohort: CT-RATE 42,544
    classes: 18 (published)
    masks: CT-RATE, gated at 99%
    runs: [ctrate_c2_seed0, ctrate_c2_seed1, ctrate_c2_seed2]
    patience: 4
    val_every: 1200
    status: queued
    finding: >-
      Blocked on mask coverage, deliberately. configs/stage2.env sets
      RAC_REQUIRE_MASK=1 and dataset.py drops any training volume without a mask,
      so at today's 67% this would have trained on 28,494 volumes instead of
      42,544 -- against a published model that had all of them -- and said so in
      one line of log. check_mask_coverage.py now exits 78 below 99%.
      The 18-class step-0 identity gate has PASSED: 49 slots over 31 rows,
      Z_final == Z_gen exactly, unconditioned tokens matching the 39-slot model to
      0.0e+00, preflight clean.

  # ------------------------------------------------------------ labels V3
  - id: V3_labels
    group: labels_v3
    arch: n/a
    cohort: peds 8,817 reports
    classes: 27
    masks: "--"
    runs: []
    status: queued
    finding: >-
      Extraction running (8 shards, 3 at a time). Definitions repaired against the
      gold standard, and the single most important change is not per class: the
      evidence citation became a GATE rather than a justification -- if no sentence
      states the finding itself, the label is 0. Kappa gains land exactly where two
      text-only audits said they would: Tree-in-bud 0.844 to 0.956, Arterial wall
      calcification 0.689 to 0.817, Lymphadenopathy 0.676 to 0.780, Peribronchial
      thickening 0.819 to 0.902. Losses cluster on classes stated diffusely
      (Bronchiectasis, Consolidation, Lung opacity) and are the same trade that
      produced the gains. Whether any of it moves AUC is untested -- that is the
      next experiment, not this one.

  # ---------------------------------------------------------------- ctx3
  - id: ctx3/masked
    group: ctx3
    arch: context
    cohort: peds + CT-RATE 49,545
    classes: 27
    masks: 100% (in production)
    runs: []
    patience: 8
    val_every: 800
    status: planned
    finding: >-
      Blocked on mask generation, which is running. 31,570 CT-RATE training masks
      arrived from another machine already in target format, taking coverage from
      14.1% (pediatrics alone) to 71.6%; the remaining 15,575 are being segmented
      here so the training set has one provenance. Worth finishing rather than
      training at 71.6% because the gap is not a random third -- sliced by patient
      id it runs 1.6 / 58 / 66 / 8 / 2 / 76 / 74 / 43 / 4 / 2 percent missing, the
      signature of a shard array that stopped part way, which would leave L_org
      fitted to a subsample selected by acquisition order.

journal:
  - date: 2026-08-27
    title: The ribcage-derived pleural region does not work -- measured, not assumed
    text: >-
      Rebuilding region 8 from the bony thorax instead of the lung leaves it
      essentially EMPTY: 130-212 voxels against the old 133k-265k, and 207 of 208
      volumes reach ZERO tokens on the 12x12x12 grid. A region with no tokens makes
      its query UNRESTRICTED, so this is not a fix but a silent deletion of the
      anatomy query. The cause is obvious in hindsight: the ribcage interior is
      already lung, heart and vessels, and the pleural region may only claim
      background, so nothing is left to claim. The decision file was NOT written and
      the overnight chain keeps the existing definition -- known behaviour beats an
      unverified one. What the first measurement actually implies is narrower and
      more useful: TotalSegmentator folds pneumothorax air INTO the lung label, so
      no pleural-space definition can capture it, and the candidate worth testing
      next is routing Pneumothorax to the lung lobes rather than to region 8.
  - date: 2026-08-27
    title: The routing penalty is two broken regions, and the fix is measured not assumed
    text: >-
      Region 8 is not the pleural space. On 400 volumes stratified for the class it
      reads +6 HU on pneumothorax positives against -98 HU on negatives -- 104 HU
      the WRONG way for an air finding, with the region twice the size. The shell is
      derived by dilating the lung union, so its geometry is a function of the
      pathology: TotalSegmentator folds pneumothorax air into the lung field, the
      shell lands further out in the chest wall, and the pooled feature ends up
      anti-correlated with the finding. Rebuilt from the bony ribcage instead, which
      does not move when a lung collapses. Being verified on a rebuilt sample before
      any of the 47k masks are committed to it.
  - date: 2026-08-27
    title: The CT-RATE-only run is set up and its 18-class gate passes
    text: >-
      Assets built and asserted, architecture verified at 18 classes (49 slots over
      31 rows, step-0 identity exact, preflight clean). The gate found three real
      faults first: RAC_FOCAL_CLASSES arrived EMPTY because an unquoted value with a
      space broke the env sourcing, so top-K focal pooling was off in every adult-
      recipe run; the age-band check refused an adult-only cohort on principle; and
      the counterfactual sampler rejected only the same accession, not the same
      text, so L_cf routinely compared a prediction with itself.
  - date: 2026-08-27
    title: The sbatch scripts had locked themselves out of 24 A100s
    text: >-
      Every GPU launcher asked for gres=gpu:large:1, and the A100s are gpu:xlarge --
      a gpu:large request can never match one, and bch-gpu-xlarge was not in the
      partition list either. gpu:large had been chosen to avoid the 24 GB TITANs
      that OOM; those are gpu-1-0 and gpu-2-0, the only medium nodes across all
      three partitions, so excluding them by name does the same job without giving
      up the pool this account contends least for.
  # Dated record. Add an entry whenever something changes what we believe or what
  # is running -- a result, a fix that invalidates a number, a decision. Dates in
  # the experiment tables are harvested from disk; these are written by hand
  # because "what it meant" is not on the filesystem.
  - date: 2026-08-26
    title: Phase 1 implemented end to end
    text: >-
      Slot layout, group-restricted attention, the C1 conditioner, the C2 relevance
      head, the context Q-Former and its step-0 identity gate, the training wiring,
      and the PHI scrubber for the indication field. The identity gate passes
      exactly: Z_final equals Z_gen, and the 39 unconditioned tokens match the
      published model to 0.0e+00.
  - date: 2026-08-26
    title: Sixteen sbatch scripts pointed at a directory with no schema.py
    text: >-
      Every launcher sourced $HOME/arc-ct, which after a home reorganisation held
      the published ADULT tree -- no configs/stage2_peds.env, a different
      train_stage2.py. Without set -e the missing env file printed one line and the
      run continued as an 18-class CT-RATE job with the Q-Former off. Silent and
      entirely wrong. Fixed with ARCCT_ROOT, a hard gate, and check_env.py.
  - date: 2026-08-26
    title: The first ladder measured almost nothing
    text: >-
      Two independent faults. beta initialised at -6, where the softplus gradient
      is sigma(-6) = 0.0025, so the relevance gate could not open -- beta moved a
      measured 0.00012 over the whole run. And the zero-init context modules trained
      at the warm-start learning rate. Rerun as ctx2 with beta_init -2 and a 20x
      learning-rate multiplier. Separately, a TypeError on ctx_out.r with C2 off
      killed nine of the ladder's twenty-four tasks.
  - date: 2026-08-27
    title: Half of CT-RATE has an indication, not a quarter
    text: >-
      The user challenged the 24% figure and was right. classify() required three
      words, which fits the pediatric requisitions (median 24 words) and discards
      the adult ones, which are often a single question. Coverage is 48.7%. An
      assertion encoding the same three-word rule had to be corrected too, since it
      blocked the fix.
  - date: 2026-08-27
    title: 31,570 CT-RATE training masks arrived, already in target format
    text: >-
      Moved from another machine at 192x192x96 with labels 0-10, so nothing needed
      converting. Coverage went from 14.1% (pediatrics alone) to 71.6% of the
      training split. An alignment check against two known-good controls put them
      between our own CT-RATE validation masks (98% pass) and our pediatric masks
      (75%), at 82% -- not broken.
  - date: 2026-08-27
    title: Generating the remaining 15,575 rather than training at 71.6%
    text: >-
      The gap is not a random third: sliced by patient id it runs 1.6 / 58 / 66 / 8
      / 2 / 76 / 74 / 43 / 4 / 2 percent missing, the signature of a shard array
      that stopped part way. All 15,575 already have their npz on disk, so nothing
      is downloaded. Also found that ts_ctrate.py could not be imported from this
      repo at all -- two lines above the __future__ import, a SyntaxError, invisible
      because ast.parse accepts it and because the valid masks were built from a
      second copy of the tree.
  - date: 2026-08-27
    title: A quiet run directory is not a finished run
    text: >-
      Building the ledger showed that runs killed at update 400 leave exactly what
      finished runs leave, and their early AUCs were being averaged in. Excluding
      them, ctx1 reads ct_only 0.7906 (not 0.7883), c1_full +0.0074 (not +0.0097),
      c2 +0.0073 (not +0.0106) -- so NO ctx1 rung clears the 0.0092 seed band,
      where two previously appeared to.
  - date: 2026-08-27
    title: The routing penalty is two regions, not the method
    text: >-
      Prompted by the user asking how telling the model where to look could possibly
      hurt this much. Per class it does not: Pneumothorax (0.695 to 0.317) and Bone
      lesion (0.616 to 0.347) fall BELOW CHANCE and carry two thirds of the whole
      -0.0375, in every cohort and every checkpoint. Excluding them the penalty is
      -0.0146 on CT-RATE and -0.0159 on pediatrics, and 7 of the remaining 24
      classes improve. Both route to the two regions we derived rather than
      segmented. Region repair is now queued ahead of any conclusion about anatomy
      routing as a method.

findings:
  - title: The seed band is 0.0046
    text: >-
      Three seeds of an identical V1 configuration give sd = 0.0046 on pediatric
      validation macro AUC. A ladder delta below roughly 0.0092 is inside that band
      and is not a difference. This is measured on the V1 recipe, not the context
      recipe, and is the most honest estimate available rather than an exact one.
  - title: Two broken regions, not a broken idea
    text: >-
      The -0.0375 routing penalty is not spread across the label set. Pneumothorax
      (0.695 to 0.317) and Bone lesion (0.616 to 0.347) fall BELOW CHANCE and carry
      about two thirds of it, in every cohort and every checkpoint. Below 0.5 is
      inversion, not misplaced attention -- looking in the wrong place gives 0.5.
      Both route to the two regions we derived rather than segmented. Excluding
      them the penalty is -0.0146 (CT-RATE) and -0.0159 (pediatrics), and 7 of the
      remaining 24 classes improve under routing. Fix those two regions before
      concluding anything about anatomy routing as a method.
  - title: The routed read-out uses a pairing that was never trained
    text: >-
      Training aligns organ_lat to region sentences (L_org) and the class prompts
      to the global latent (L_cls). Evaluation scores organ_lat against the class
      prompts. Part of the residual routing penalty is therefore a read-out
      mismatch and not a property of anatomy routing.
  - title: Validation AUC is not a result
    text: >-
      The val AUC columns are what the training loop selected checkpoints on. They
      are computed on the split the model stopped early against, so they are
      optimistically biased by construction. Only eval_matrix numbers are
      reportable, and only with the patient-clustered bootstrap CI beside them.
  - title: A quiet run directory is not a finished run
    text: >-
      A run killed at update 400 leaves what a finished run leaves: a best.pt, a
      best_auc file, and silence. Nine of the first ladder's twenty-four tasks died
      that way, and averaging their early AUCs would report those arms as worse
      than they are. Runs below patience x val_every are marked DIED and excluded.
  - title: Half of CT-RATE has an indication, not a quarter
    text: >-
      An early filter required three words, which suited the pediatric requisitions
      (median 24 words) and threw away the adult ones, which are often a single
      question. Corrected, CT-RATE indication coverage is 48.7%, not 24.1%.
